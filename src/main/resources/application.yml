server:
  port: 8080

spring:
  application:
    name: treasure-family-backend
  datasource:
    url: jdbc:h2:file:./data/treasure-family;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

treasure-family:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://liangjs0505-dotcom.github.io,http://47.100.207.84}
  auth:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
    jwt-secret: ${JWT_SECRET:}
    token-ttl-days: 30
    max-failed-attempts: 5
    lock-minutes: 15
